services:
  pishovichok:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: pishovichok-ui
    init: true
    ports:
      - "${PISHOVICHOK_UI_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PISHOVICHOK_UI_HOST: "0.0.0.0"
      PISHOVICHOK_UI_PORT: "8080"
      PISHOVICHOK_OLLAMA_BASE_URL: "${PISHOVICHOK_DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
